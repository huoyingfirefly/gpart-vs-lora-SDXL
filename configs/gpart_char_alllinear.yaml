# Row: gp_char_alllinear  GPart, all-linear coverage. Score 0.40 @ a1.0,
#                          0.55 @ a1.3, 0.57 @ a1.5, 0.40 @ a1.8.
#
# Byte-identical to gpart_char_attn2 except `targets`.
# Bare names match both attn1 and attn2 => 10 linears/block x 70 blocks = 700 modules,
# 2184.0 M covered weights, the same coverage as the matched LoRA.
name: gpart_char_alllinear
adapter: gpart
d: 23224320
targets: ["to_q", "to_k", "to_v", "to_out.0", "ff.net.0.proj", "ff.net.2"]
scope: transformer_block
layers_pattern: transformer_blocks
backend: stateless
partition_mode: splitmix64
data: data/aima_var
output: runs/gpart_char_alllinear

train:
  steps: 1200
  grad_accum: 2
  lr: 5.0e-4
  lr_schedule: constant
  warmup: 50
  weight_decay: 0.0
  max_res: 1536
  noise_offset: 0.05
  min_snr_gamma: 5.0
  grad_clip: 1.0
  seed: 42
  holdout: 4
  val_every: 200
  val_batches: 4
  save_every: 200

# sweep every alpha in the list against the same adapter directory
sample:
  alpha: [1.0, 1.3, 1.5, 1.8]
  steps: 30
  cfg: 5.0
  size: [832, 1216]
  sched: euler_a
  spacing: trailing
  seeds: [310977364113511, 12345, 67890, 111111, 222222, 333333]
  prompts: configs/prompts/p0_p1.jsonl
